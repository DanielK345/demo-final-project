# fly.toml app configuration file for AloSM Voice AI
# Reference: https://fly.io/docs/reference/configuration/

app = "alosm-voice-ai"
primary_region = "sin" # Singapore region for lowest latency to Vietnam

[build]
  dockerfile = "Dockerfile"

[processes]
  app = "uvicorn src.main:app --host 0.0.0.0 --port 8000"
  worker = "python -m src.voice_agent.server dev"

[env]
  APP_ENV = "production"
  PORT = "8000"
  VOICE_RUNTIME = "livekit"
  LOG_LEVEL = "INFO"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[http_service.checks]]
  grace_period = "15s"
  interval = "30s"
  method = "GET"
  timeout = "5s"
  path = "/health/ready"

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
  processes = ["app", "worker"]
