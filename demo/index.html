<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>AloSM Voice AI — Demo</title>
<style>
  :root { color-scheme: dark; }
  body {
    font-family: -apple-system, "Segoe UI", system-ui, sans-serif;
    max-width: 640px;
    margin: 40px auto;
    padding: 0 16px;
    background: #0b0f14;
    color: #e6edf3;
  }
  h1 { font-size: 1.4rem; margin-bottom: 4px; }
  .hint { color: #9fb3c8; font-size: 0.9rem; margin-top: 0; }
  #call-button {
    font-size: 1.05rem;
    padding: 12px 28px;
    border-radius: 999px;
    border: none;
    cursor: pointer;
    background: #2563eb;
    color: white;
    font-weight: 600;
  }
  #call-button[data-state="in-call"] { background: #dc2626; }
  #status { margin: 16px 0; font-size: 1rem; color: #9fb3c8; }
  #transcript {
    margin-top: 8px;
    border: 1px solid #263241;
    border-radius: 10px;
    padding: 12px 16px;
    height: 340px;
    overflow-y: auto;
    background: #111823;
  }
  .line { margin: 6px 0; line-height: 1.45; }
  .line.user { color: #93c5fd; }
  .line.agent { color: #86efac; }
</style>
</head>
<body>
  <h1>🚕 AloSM Voice AI — Demo</h1>
  <p class="hint">
    Bấm "Gọi", cho phép quyền microphone, rồi thử nói ví dụ:
    "Tôi muốn đặt xe từ Vincom Đồng Khởi đến Landmark 81".
    Dùng trình duyệt Chrome hoặc Edge.
  </p>
  <button id="call-button" data-state="idle">Gọi</button>
  <div id="status">⏸️ Chờ</div>
  <div id="transcript"></div>
  <script src="demo.js"></script>
</body>
</html>
