name: CI - Test & Typecheck

on:
  push:
    branches:
      - main
      - develop
      - "feature/**"
  pull_request:
    branches:
      - main
      - develop

jobs:
  backend-test:
    name: Backend Pytest & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Install dependencies
        run: |
          uv sync --frozen || uv pip install -r requirements.txt

      - name: Run Backend Pytest
        env:
          APP_ENV: test
          DATABASE_URL: sqlite+aiosqlite:///./data/test.db
          QUOTE_SIGNING_KEY: "acceptance_test_signing_key_at_least_32_bytes_long_12345"
          FIELD_ENCRYPTION_KEY: "acceptance_test_field_encryption_key_32_bytes_123"
        run: |
          uv run pytest tests/ -v

  frontend-build:
    name: Frontend Typecheck & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: src/frontend/package-lock.json

      - name: Install dependencies
        run: |
          cd src/frontend && npm ci

      - name: TypeScript & Vite Build
        run: |
          cd src/frontend && npm run build
