<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 80" fill="none">
  <defs>
    <!-- Gradient background for squircle icon -->
    <linearGradient id="alosmGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#54B4E8" />
      <stop offset="50%" stop-color="#00D1C1" />
      <stop offset="100%" stop-color="#00C9A7" />
    </linearGradient>
    
    <!-- Gradient for electric car body -->
    <linearGradient id="carGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#55BFE5" />
      <stop offset="100%" stop-color="#14CBA8" />
    </linearGradient>
  </defs>

  <!-- Squircle Icon Box -->
  <rect x="4" y="4" width="72" height="72" rx="22" fill="url(#alosmGradient)" />

  <!-- White Inner Circle -->
  <circle cx="40" cy="40" r="27" fill="#FFFFFF" />

  <!-- Electric Car Body -->
  <g transform="translate(18, 24)">
    <!-- Car Roof & Body Shell -->
    <path d="M 6 18 C 6 13, 11 8, 17 8 L 27 8 C 33 8, 38 12, 40 18 L 42 20 C 43.5 20, 45 21.5, 45 23.5 L 45 25 C 45 27, 43.5 28, 41 28 L 3 28 C 1 28, 0 27, 0 25 L 0 23.5 C 0 21.5, 1.5 20, 3 20 Z" fill="url(#carGradient)" />
    
    <!-- Front Window Cutout -->
    <path d="M 17 10 L 26 10 C 29.5 10, 32.5 12.5, 34 16 L 14 16 C 14.5 13, 15.5 10, 17 10 Z" fill="#E0F7FA" opacity="0.9" />

    <!-- Wheels -->
    <!-- Rear Wheel -->
    <circle cx="11" cy="27" r="5" fill="#FFFFFF" />
    <circle cx="11" cy="27" r="4" fill="url(#carGradient)" />
    <circle cx="11" cy="27" r="1.8" fill="#FFFFFF" />

    <!-- Front Wheel -->
    <circle cx="34" cy="27" r="5" fill="#FFFFFF" />
    <circle cx="34" cy="27" r="4" fill="url(#carGradient)" />
    <circle cx="34" cy="27" r="1.8" fill="#FFFFFF" />

    <!-- Lightning Bolt Icon inside door -->
    <path d="M 23 18 L 20 22.5 L 22.5 22.5 L 21 27 L 26 21.5 L 23.5 21.5 Z" fill="#FFFFFF" />
  </g>

  <!-- Typography -->
  <!-- "AloSM" Text -->
  <text x="94" y="44" font-family="'Montserrat', sans-serif" font-weight="800" font-size="34" fill="#2E3338" letter-spacing="-0.5">AloSM</text>
  
  <!-- "AI Booking" Text -->
  <text x="94" y="68" font-family="'Montserrat', sans-serif" font-weight="500" font-size="22" fill="#5D646B" letter-spacing="0">AI Booking</text>
</svg>
