version: "3.9"

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      asr-server:
        condition: service_healthy
    environment:
      - ZIPFORMER_WS_URL=ws://asr-server:9000/v1/stt

  asr-server:
    build:
      context: .
      dockerfile: asr_server/Dockerfile
    ports:
      - "9000:9000"
    env_file:
      - .env
    volumes:
      - ./data/models/asr:/app/data/models/asr:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/ready"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 120s

  voice-agent:
    build:
      context: .
      dockerfile: Dockerfile
    command: python -m src.voice_agent.server start
    env_file:
      - .env
    environment:
      - ZIPFORMER_WS_URL=ws://asr-server:9000/v1/stt
    depends_on:
      asr-server:
        condition: service_healthy
    restart: unless-stopped
